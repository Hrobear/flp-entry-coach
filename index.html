<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLPエントリーシート 作成ナビ 2027</title><style>
:root{--navy:#172c43;--blue:#2563a6;--sky:#edf4fb;--line:#dce3ea;--muted:#657487;--bg:#f5f7fb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2d3e;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.65}.shell{max-width:1100px;margin:auto;padding:24px 18px 64px}header{background:linear-gradient(120deg,#19354e,#254d72);color:white;padding:38px 0}header .shell{padding-top:0;padding-bottom:0}.kicker{font-size:12px;letter-spacing:.14em;opacity:.85}h1{font-size:clamp(25px,4vw,37px);line-height:1.3;margin:10px 0}header p{opacity:.9;max-width:720px;margin:0}.layout{display:grid;grid-template-columns:225px 1fr;gap:24px;align-items:start}.sidebar{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;position:sticky;top:14px}.navbtn{display:block;width:100%;border:0;background:white;text-align:left;padding:12px;border-radius:9px;cursor:pointer;color:#3c4e62;font-size:14px}.navbtn.active{background:var(--sky);font-weight:bold;color:#124775}.navbtn small{float:right;color:#778697}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,32px);box-shadow:0 5px 24px #19354e07}.sub{color:var(--muted);font-size:14px}h2{font-size:24px;margin:8px 0 4px}h3{font-size:16px;margin:26px 0 10px}.tag{display:inline-block;font-size:12px;font-weight:bold;color:#276099;background:#edf5fd;border-radius:40px;padding:3px 10px}.progress{height:7px;background:#e8eef4;border-radius:20px;overflow:hidden;margin:18px 0 25px}.progress span{height:100%;background:#3676b1;display:block;transition:width .2s}.question{padding:17px 0;border-bottom:1px solid #e9edf1}.question label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}.hint{font-size:12px;color:var(--muted);margin-bottom:9px}textarea,input{width:100%;border:1px solid #cfd9e4;border-radius:9px;padding:12px;background:#fff;font:inherit;font-size:14px;color:#21364b}textarea{resize:vertical;min-height:86px}textarea:focus,input:focus{outline:2px solid #a8cae9;border-color:#3676b1}.draft{min-height:250px}.feedback{background:#f3f7fb;border:1px solid #d9e6f3;border-radius:12px;padding:18px;margin:24px 0}.feedback h3{margin:0 0 10px}.feedback ul{padding-left:20px;margin:8px 0}.feedback li{margin:6px 0}.good{color:#236748}.warn{color:#9c5b11}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}button{cursor:pointer;font:inherit}button.primary{color:white;background:var(--blue);border:1px solid var(--blue);padding:11px 18px;border-radius:9px;font-weight:bold}.secondary{color:#254766;background:#fff;border:1px solid #b8cadb;padding:11px 18px;border-radius:9px}.count{font-size:13px;color:var(--muted);text-align:right;margin:7px 0}.count.over{color:#b92f37;font-weight:bold}.info{border-left:3px solid #679bd0;padding:8px 14px;background:#f4f8fc;font-size:13px;margin:20px 0}.muted{color:var(--muted)}.foot{font-size:12px;color:#617184;margin-top:24px}.micro{font-size:12px}.last{margin-top:12px}#status{font-size:12px;color:#52718d;margin-top:8px}@media(max-width:760px){.layout{display:block}.sidebar{position:static;display:flex;overflow-x:auto;gap:5px;margin-bottom:14px}.navbtn{white-space:nowrap;width:auto;flex:none}.navbtn small{display:none}.card{padding:20px}header{padding:20px 0}}
</style></head><body><header><div class="shell"><div class="kicker">2027 FLP ENTRY GUIDE</div><h1>あなたの言葉で、志望理由をつくる。</h1><p>地域・公共マネジメントプログラム エントリーシート支援ナビ。質問に答え、材料を整理し、ひとつずつ文章に仕上げていきましょう。</p></div></header><main class="shell"><div class="layout"><nav class="sidebar" id="nav" aria-label="設問選択"></nav><section class="card" id="main" aria-live="polite"></section></div><p class="foot">入力内容は通常この端末のブラウザに保存されます。「Geminiに相談する」を押すと、選択中の回答と学習情報がAIサービスへ送信されます。個人情報・秘密情報は入力しないでください。共有端末では使用後にデータを消去してください。実際の提出条件は募集要項で確認してください。</p></main><script>
const sections=[
{title:'準備・学業',short:'準備',limit:0,goal:'志望先と、前期の学習成果を整理する',lead:'前期の成績が優秀だったことは大きな材料。ただし数字よりも「どう学んだか」に注目しましょう。',qs:[['seminar','希望するゼミは？','教員名・ゼミ名・研究テーマ。未定なら候補でも大丈夫です。'],['seminarfit','そのゼミのどこにひかれましたか？','研究内容、フィールドワーク、ゼミの活動方法など。'],['gpa','前期のGPAや成績の特徴は？','例：GPA、評価の割合、得意だった授業。具体的な数値が不明なら空欄でOK。'],['classes','面白かった授業・印象に残った論点は？','授業名だけでなく「何が面白かったか」を書こう。'],['study','良い成績を取るために、実際にどんな工夫をしましたか？','授業の取り組み、復習、調べ方、時間管理など。'] ]},
{title:'① 自己PR',short:'自己PR',limit:400,goal:'強みを「具体的な行動」で証明する',lead:'自分の性格を列挙するより、何を考えて何をしたかを語ろう。学業成績は努力や工夫の裏付けになります。',qs:[['strength','いちばん伝えたい自分の強みは？','一つに絞る。例：疑問を放置しない、粘り強く続ける。'],['strengthScene','その強みが表れた具体的な場面は？','授業、友人との活動、アルバイトなど。'],['action','その場面で自分は何を考え、どう行動した？','「頑張った」ではなく動作・工夫を具体的に。'],['result','結果はどうなった？何を学んだ？','数字や周囲の反応があれば。ただし無理に作らない。'],['apply','その強みをゼミではどう生かせる？','話し合い、資料調査、現地調査などに接続する。']]},
{title:'② 志望理由・専門分野',short:'志望理由',limit:600,goal:'問題意識から「なぜこのゼミか」までつなぐ',lead:'最重要項目です。興味の表明にとどまらず、研究したい「問い」とゼミとの適合性を示そう。',qs:[['trigger','地域や公共の問題に関心を持ったきっかけは？','身近な経験・授業・ニュースなど、本当に経験したもの。'],['problem','どんな社会課題を特に考えたい？','人口減少、地域交通、財政、地域格差など。自分の言葉で具体的に。'],['why','その問題はなぜ生じると思う？','原因の仮説や、対立する立場を考えよう。'],['research','ゼミで明らかにしたい問いは？','例：「財政制約のもとで、どの政策を優先すべきか」。'],['fit','その問いを探究するうえで、なぜこのゼミなの？','教員の専門やゼミの活動との接点を具体的に。'],['method','どんな調査・議論・活動をしてみたい？','資料比較、現場観察、ヒアリングなど。']]},
{title:'③ 将来の希望',short:'将来',limit:400,goal:'仕事の名前より、実現したい価値を描く',lead:'進路が未定でも大丈夫。どんな問題に関わり、どういう力を身につけたいかを書こう。',qs:[['future','将来、誰のどんな困りごとを減らしたい？','職業が決まっていなくてもOK。'],['reason','そう考えるようになった理由は？','自分の経験や価値観に結びつける。'],['career','興味のある仕事・関わり方は？','自治体、民間企業、NPO、研究など複数でも可。'],['skills','そのために必要な知識・能力は？','政策分析、合意形成、データ分析など。'],['steps','大学生活で何に挑戦したい？','ゼミで身につけたいことにつなげる。']]},
{title:'④ 最近の関心',short:'最近の関心',limit:400,goal:'出来事の紹介ではなく、自分の分析を示す',lead:'ニュースや本は題材です。「自分はどう考えたか」が主役。賛否・利害の両面を見てみよう。',qs:[['topic','最近、気になった記事・本・番組・出来事は？','タイトル・媒体・日付がわかれば記録。'],['interest','なぜそれが気になった？','自分の経験や授業内容とのつながり。'],['sides','誰と誰の立場が異なり、何が難しい？','メリット・デメリット、制約、対立点。'],['opinion','自分はどう考える？その理由は？','事実と意見は分けて書こう。'],['open','まだわからないこと・調べたいことは？','問いで締めるのも有効。']]},
{title:'⑤ 特技・趣味',short:'趣味',limit:400,goal:'ほかの設問から見えない素顔を伝える',lead:'無理に社会貢献へ結びつけなくて大丈夫。取り組み方や楽しみ方に個性が出ます。',qs:[['hobby','普段、何をしていると楽しい？','趣味・特技を自然に。'],['start','それを始めたきっかけは？','小さな出来事でもOK。'],['hobbyHow','どんなふうに続けたり、工夫したりしている？','頻度、こだわり、自分らしさ。'],['hobbyMeaning','自分にとってどんな意味がある？','気分転換、交流、発見など。']]},
{title:'⑥ 課外活動',short:'課外活動',limit:400,goal:'肩書きではなく役割・工夫・学びを示す',lead:'部活・ボランティアなど、高校以降の活動。大きな実績がなくても、実際の行動を書こう。',qs:[['activities','高校以降に取り組んだ課外活動は？','部活動、ボランティア、クラブ等。該当がなければ無理に作らない。'],['role','そこでの自分の役割は？','役職がなくても実際に担当したこと。'],['challenge','どんな難しさがあった？','意見の違い、継続、計画など。'],['activityAction','何を工夫し、どう行動した？','具体的な手順や対応。'],['activityResult','どんな結果や学びがあった？','自分の貢献と全体の成果を区別。']]},
{title:'資格・提出前チェック',short:'最終確認',limit:0,goal:'記載漏れ・内容の重複・字数超過を確認',lead:'資格や証明書類の提出指示も忘れずに。完成した原稿をまとめて出力できます。',qs:[['quals','語学検定・資格試験などは？','資格名、級・スコア、取得時期。ない場合は空欄でOK。']]}];
const key='flp2027_workbook_v1';let store={};try{store=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let active=0;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=k=>store[k]||'';const save=()=>{try{localStorage.setItem(key,JSON.stringify(store));$('status').textContent='この端末に自動保存しました'}catch(e){$('status').textContent='ブラウザに保存できませんでした。テキストを出力してください。'}};const count=s=>Array.from(s||'').length;function score(s){const a=sections[s];return a.qs.filter(q=>val(q[0]).trim()).length+(a.limit&&val('draft'+s).trim()?1:0)}
function feedback(s){const a=sections[s],missing=a.qs.filter(q=>!val(q[0]).trim()),draft=val('draft'+s),len=count(draft),msgs=[];if(missing.length)msgs.push('材料を充実させるには、まず「'+missing.slice(0,2).map(q=>q[1]).join('」「')+'」に答えてみよう。');else msgs.push('質問への回答はそろいました。回答同士のつながりを文章にしてみよう。');if(a.limit){if(!draft.trim())msgs.push('本文はまだ空欄です。質問への回答を「結論→具体例→学び・今後」の順に組み立てよう。');else if(len>a.limit)msgs.push('字数制限を'+(len-a.limit)+'字超えています。説明の重複や一般論を削り、具体的な行動を残そう。');else msgs.push('本文 '+len+' / '+a.limit+'字。字数制限内です。');}
const t=draft.trim();if(s===1&&t&&!/例えば|とき|際|授業|活動|経験|実際|取り組|工夫/.test(t))msgs.push('自己PRには、強みが表れた具体的な場面を追加すると説得力が上がる。');if(s===2&&t&&!/なぜ|疑問|研究|明らか|課題|分析|考え/.test(t))msgs.push('志望理由では、知りたいことを「研究の問い」として明示しよう。');if(s===4&&t&&!/一方|他方|しかし|反面|ただし|課題|問題/.test(t))msgs.push('自分と異なる立場や制度上の制約にも触れられるか考えよう。');if(s===0&&val('gpa')&&val('study'))msgs.push('前期の成績と学習上の工夫は、①自己PRに活用できる材料です。');return msgs}
function render(){const a=sections[active];$('nav').innerHTML=sections.map((x,i)=>`<button class="navbtn ${i===active?'active':''}" data-go="${i}">${esc(x.short)} <small>${score(i)}/${x.qs.length+(x.limit?1:0)}</small></button>`).join('');const completed=sections.reduce((n,x,i)=>n+score(i),0),total=sections.reduce((n,x)=>n+x.qs.length+(x.limit?1:0),0);$('main').innerHTML=`<span class="tag">${active===0?'START':active===7?'FINISH':'QUESTION '+active+' / 6'}</span><h2>${esc(a.title)}</h2><div class="sub">${esc(a.goal)}</div><div class="progress"><span style="width:${Math.round(completed/total*100)}%"></span></div><div class="info">${esc(a.lead)}</div><h3>まず、質問に答えてみよう</h3>`+a.qs.map((q,j)=>`<div class="question"><label for="q${j}">${j+1}. ${esc(q[1])}</label><div class="hint">${esc(q[2])}</div><textarea id="q${j}" data-field="${q[0]}" placeholder="思いつくままに書いて大丈夫。箇条書きでもOK">${esc(val(q[0]))}</textarea></div>`).join('')+(a.limit?`<h3>エントリーシート本文</h3><p class="sub">ここは最終的に提出する文章を自分の言葉で書く欄です。質問への回答をそのまま並べる必要はありません。</p><textarea class="draft" data-field="draft${active}" id="draft" placeholder="ここに文章を書こう">${esc(val('draft'+active))}</textarea><div class="count ${count(val('draft'+active))>a.limit?'over':''}" id="count">${count(val('draft'+active))} / ${a.limit} 字</div>`:'')+`<div class="feedback"><h3>書き方のアドバイス</h3><ul id="feedbacklist"></ul></div><div class="actions"><button class="secondary" id="prev" ${active===0?'disabled':''}>前の項目</button><button class="primary" id="next">${active===7?'はじめに戻る':'次の項目へ'}</button><button class="secondary" id="ai">Geminiに相談する</button><button class="secondary" id="copyprompt">相談文をコピー</button><button class="secondary" id="export">全項目をテキスト保存</button></div><div id="status" role="status">回答内容は自動保存されます</div><section class="feedback" id="airesult" hidden><h3>Geminiからのアドバイス</h3><div id="aitext" style="white-space:pre-wrap;line-height:1.9"></div><div class="actions"><button class="secondary" id="copyai">助言をコピー</button></div></section><div class="last micro muted">AIに相談すると入力内容がGeminiへ送られます。AIの提案は参考にとどめ、事実や本人の意向を確認してください。</div>${active===7?'<div class="actions"><button class="secondary" id="clear">この端末の回答をすべて消去</button></div>':''}`;
$('main').querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{store[el.dataset.field]=el.value;save();updateFeedback();}));$('nav').querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(+el.dataset.go)));$('prev').addEventListener('click',()=>go(active-1));$('next').addEventListener('click',()=>go(active===7?0:active+1));$('copyprompt').addEventListener('click',copyPrompt);$('ai').addEventListener('click',askAI);$('copyai').addEventListener('click',()=>navigator.clipboard.writeText($('aitext').textContent).then(()=>{$('status').textContent='助言をコピーしました'}));$('export').addEventListener('click',exportTxt);if($('clear'))$('clear').addEventListener('click',()=>{if(confirm('すべての回答をこの端末から消去しますか？')){store={};save();go(0)}});updateFeedback();}
function updateFeedback(){const a=sections[active];$('feedbacklist').innerHTML=feedback(active).map(x=>'<li>'+esc(x)+'</li>').join('');if(a.limit){const n=count(val('draft'+active));$('count').textContent=n+' / '+a.limit+' 字';$('count').className='count'+(n>a.limit?' over':'')}const completed=sections.reduce((n,x,i)=>n+score(i),0),total=sections.reduce((n,x)=>n+x.qs.length+(x.limit?1:0),0);document.querySelector('.progress span').style.width=Math.round(completed/total*100)+'%';}
function go(n){if(n<0||n>=sections.length)return;active=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function getPrompt(){const a=sections[active];return `あなたは大学FLP地域・公共マネジメントプログラムのエントリーシートを支援する編集コーチです。以下は学生本人の回答です。内容を捏造せず、本人らしい自然な日本語を守りながら、(1)良い点 (2)深掘りすべき質問（最大3つ） (3)構成案 (4)提出用の文章案 を示してください。${a.limit?'文章案は'+a.limit+'字以内で。':'準備情報の整理と活用案を示してください。'}事実未確認の情報は補わないでください。\n\n【対象】${a.title}\n${a.qs.map(q=>q[1]+'\n'+(val(q[0])||'（未回答）')).join('\n\n')}\n\n【現在の本文】\n${val('draft'+active)||'（未作成）'}\n\n【学業の情報】\nGPA・成績：${val('gpa')||'未回答'}\n印象的な授業：${val('classes')||'未回答'}\n学び方の工夫：${val('study')||'未回答'}\n希望ゼミ：${val('seminar')||'未回答'}\nゼミの魅力：${val('seminarfit')||'未回答'}`}
const API_ENDPOINT=''; // 公開前に Cloudflare Workers のURLを指定: https://xxxx.workers.dev
async function askAI(){
 if(!API_ENDPOINT){$('status').textContent='AI接続先が未設定です。公開者に設定を依頼してください。';return;}
 let accessToken=sessionStorage.getItem('flp_access_token');
 if(!accessToken){accessToken=prompt('アクセスコードを入力してください（Google APIキーではありません）');if(!accessToken)return;sessionStorage.setItem('flp_access_token',accessToken)}
 const button=$('ai');button.disabled=true;button.textContent='Geminiに問い合わせ中…';$('status').textContent='AIへ回答を送信しています';
 try{
  const r=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+accessToken},body:JSON.stringify({prompt:getPrompt()})});
  const data=await r.json().catch(()=>({}));
  if(r.status===401){sessionStorage.removeItem('flp_access_token');throw Error('アクセスコードが正しくありません')}
  if(!r.ok)throw Error(data.error||'AIの応答取得に失敗しました');
  $('aitext').textContent=data.text||'回答がありません';$('airesult').hidden=false;$('status').textContent='AIからの助言を取得しました。';
 }catch(e){$('status').textContent='エラー: '+e.message}finally{button.disabled=false;button.textContent='Geminiに相談する'}
}
async function copyPrompt(){const t=getPrompt();try{await navigator.clipboard.writeText(t);$('status').textContent='相談用の文章をコピーしました。ChatGPTへ貼り付けてください。'}catch(e){const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();$('status').textContent='相談用の文章をコピーしました。'}}
function exportTxt(){let t='2027年度 FLP 地域・公共マネジメント エントリーシート 作成メモ\n'+new Date().toLocaleString('ja-JP')+'\n\n';sections.forEach((s,i)=>{t+='■ '+s.title+'\n';s.qs.forEach(q=>t+=q[1]+'\n'+(val(q[0])||'（未回答）')+'\n\n');if(s.limit)t+='【提出用本文】（'+count(val('draft'+i))+'/'+s.limit+'字）\n'+(val('draft'+i)||'（未作成）')+'\n\n';});const blob=new Blob(['\ufeff'+t],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='FLPエントリーシート_作成メモ.txt';link.click();URL.revokeObjectURL(url);$('status').textContent='作成メモを保存しました。'}render();
</script></body></html>
